{# Marta + the Hoyt jukebox: one bubble, one sheet, on every page (base.html). #}
    <!-- THE bubble: one button for Marta + Hoyt (cover spins while music plays, badge = unread Marta) -->
    <div class="chat-bubble-icon" id="chatBubbleIcon" title="Marta and the Hoyt jukebox">
        <img id="jbBubbleImg" src="{{ url_for('static', filename='jukebox/hoyt.jpg') }}" alt="">
        <span class="jb-bubble-label" id="jbBubbleLabel"></span>
        <div id="chatBadge" class="chat-badge" style="display: none;"></div>
    </div>

    <!-- The table sheet: one bottom sheet on phones (tabs), one docked card in the desktop rail (stacked) -->
    <div class="ts-sheet" id="tableSheet" data-tab="marta">
        <div class="ts-tabs">
            <button class="ts-tab" id="tsTabMarta">Marta</button>
            <button class="ts-tab" id="tsTabHoyt">Hoyt</button>
            <button class="ts-close" id="tsClose" aria-label="Close">×</button>
        </div>
    <div class="chat-window" id="chatWindow">
        <div class="jb-mini" id="jbMini" hidden>
            <img id="jbMiniImg" src="{{ url_for('static', filename='jukebox/hoyt.jpg') }}" alt="">
            <div class="jb-mini-text" id="jbMiniText"><div class="jb-mini-title" id="jbMiniTitle"></div><div class="jb-mini-album" id="jbMiniAlbum"></div></div>
            <button class="jb-mini-btn" id="jbMiniPlay" aria-label="Play or pause">▶</button>
            <button class="jb-mini-btn" id="jbMiniNext" aria-label="Next">⏭</button>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-pills" id="chatPills" hidden></div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Type a message..." maxlength="100">
            <button data-action="sendMessage">Send</button>
        </div>
    </div>

    <!-- Hoyt Axton jukebox pane (inside the table sheet) -->
    <div class="jb-panel" id="jbPanel">
        <div class="jb-locked" id="jbLocked" hidden>
            <img src="{{ url_for('static', filename='jukebox/hoyt.jpg') }}" alt="">
            <div class="jb-title">Hoyt plays for players</div>
            <div class="jb-album">Log in and the jukebox is yours: 43 records, 667 songs.</div>
            <button class="jb-pill" data-action="handleLoginClick">Log in</button>
        </div>
        <div class="jb-now" id="jbNow">
            <img id="jbCover" src="{{ url_for('static', filename='jukebox/hoyt.jpg') }}" alt="">
            <div class="jb-title" id="jbTitle">Hoyt Axton</div>
            <div class="jb-album" id="jbAlbum">Tap play for some Hoyt</div>
            <div class="jb-barwrap" id="jbBarWrap"><div class="jb-bar" id="jbBar"></div></div>
            <div class="jb-time" id="jbTime"></div>
            <div class="jb-controls">
                <button id="jbPrev" aria-label="Previous">⏮</button>
                <button id="jbPlay" class="jb-big" aria-label="Play">▶</button>
                <button id="jbNext" aria-label="Next">⏭</button>
            </div>
            <div class="jb-mode" id="jbMode"></div>
            <div class="jb-stats" id="jbStats" hidden>
                <div class="jb-stats-row"><span id="jbStatPlays"></span><span id="jbStatHours"></span><span id="jbStatSongs"></span></div>
                <div class="jb-stats-top" id="jbStatTop"></div>
                <a class="jb-stats-link" href="/stats#hoyt" target="_blank">All the listening stats</a>
            </div>
        </div>
        <div class="jb-browse" id="jbBrowse" hidden>
            <div class="jb-albums" id="jbAlbums"></div>
        </div>
        <div class="jb-footer">
            <input class="jb-search" id="jbSearch" type="search" placeholder="Find a song or album…" autocomplete="off">
            <button class="jb-pill jb-pill-dark" id="jbTabBrowse">Albums</button>
            <button class="jb-pill" id="jbTabNow" hidden>Back</button>
        </div>
    </div>
    </div><!-- /tableSheet -->
    <div class="jb-toast" id="jbToast"></div>
