cron:
  # Otto vs Marta. A tick every 15 minutes (96/day); each tick plays 0-2 games so the day's
  # quota lands evenly. The quota itself is drawn fresh per calendar day, 1 to 100 games
  # (Andy, 2026-09-06: "let it pick between 1-100 games a day at random"). Marta ratchets
  # against Otto after every game like she does against a person. Thousand-game analysis runs
  # still happen on a laptop (python -m utilities.otto), never here. Needs the Cloud Scheduler
  # API enabled on the project (done 2026-09-06); cron.yaml jobs are not billed as Scheduler jobs.
  - description: Otto plays Marta for the Robot League
    url: /cron/otto
    schedule: every 15 minutes
    timezone: America/Los_Angeles
  # Andy's stand-in (Andy, 2026-09-06): about three days a week, 1-3 games at random daytime
  # hours, logged as Andy through the human path; hands.played_by = 'andybot' is the only mark.
  - description: Andy's stand-in plays Marta on planned hours
    url: /cron/andybot
    schedule: every 1 hours from 09:00 to 21:00
    timezone: America/Los_Angeles
