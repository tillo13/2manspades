cron:
  # The web process's own warm-up: /stats payload, reroll view, bid bias. It stays on App Engine
  # because it fills this process's memory. Every 30 min at :07 and :37 as before; the stats
  # build only runs on a process with nothing cached (the 2026-09-24 quarter-hour read spike).
  - description: Keep the web process's /stats and bid bias warm
    url: /cron/warm
    schedule: every 30 minutes from 00:07 to 23:37
    timezone: America/Los_Angeles

# The game-playing crons moved to the twomanspades-crons Cloud Run job on 2026-09-30
# (tools/cloud_run_crons.py), started by Cloud Scheduler with the task as the container arg:
#   twomanspades-otto          7,37 * * * *   Otto vs Marta; 0-3 games per tick so the day's quota
#                                             (1-100, drawn per calendar day, Andy 2026-09-06) lands
#                                             evenly. Marta ratchets against Otto after every game.
#   twomanspades-andybot       0 9-21 * * *   Andy's stand-in (Andy, 2026-09-09): 2-4 games at random
#                                             Pacific hours, logged as Andy; hands.played_by = 'andybot'.
#   twomanspades-prune-events  20 3 * * *     Archive aged action_card_play rows (44% of game_events,
#                                             read by nothing) out of the hot table.
# Why: a ruthless Marta game is up to 27 s of pure-Python solving, and on the single-worker F1 it
# slowed every page in the process (fleet isolation graded /cron/otto critical, worst tick 53.9 s).
# Thousand-game analysis runs still happen on a laptop (python -m utilities.otto), never here.
